[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "a2-radar"
version = "2.1.0"
description = "mimasdev tarafından kanatlı bir oyunun ikincisi için geliştirilmiş pasif ağ dinleyen Hidden Cube yön radarı, rota planlayıcı ve yol haritası paneli"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mimasdev" }]
keywords = ["radar", "overlay", "hidden-cube"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "scapy>=2.5.0",
    "lz4>=4.3.0",
    "psutil>=5.9.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
tools = ["opencv-python-headless>=4.8", "numpy>=1.26"]

[project.gui-scripts]
a2radar = "a2radar.app:main"

[tool.setuptools]
packages = ["a2radar"]

[tool.setuptools.package-data]
a2radar = ["data/README.md"]
